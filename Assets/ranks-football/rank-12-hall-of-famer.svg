 <title id="title">Hall of Famer rank insignia</title>
 <desc id="desc">EFL Dynasty football-club rank patch with 3 stitched field stripes, football, kick-return trails, goalposts, silver veteran thread, All-Pro metallic ring and stadium lights, 4 gold captain stars, gold laurels, Hall of Fame gold medallion and arch.</desc>
