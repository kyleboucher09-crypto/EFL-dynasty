  <path d="M88 50q72-22 144 0 32 12 32 54v102q0 72-104 113Q56 278 56 206V104q0-42 32-54Z" fill="url(#weave)" stroke="#45a3ff" stroke-width="2.5" stroke-dasharray="4 5" opacity=".92"/>
  <path d="M67 107q93-39 186 0" fill="none" stroke="#45a3ff" stroke-width="3" opacity=".35"/>
 </g>
 
 
 <g filter="url(#thread)"><rect x="119" y="53" width="82" height="29" rx="8" fill="#061225" stroke="#45a3ff" stroke-width="3"/><text x="160" y="75" text-anchor="middle" fill="#f5f9ff" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="900" letter-spacing="4">EFL</text></g>
 
 
 
