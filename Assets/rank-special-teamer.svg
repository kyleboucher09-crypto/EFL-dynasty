<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Special Teamer rank patch</title>
  <desc id="desc">Navy, electric blue, and gold football rank patch marked ST.</desc>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff0a3"/><stop offset=".4" stop-color="#e8b84a"/><stop offset="1" stop-color="#9a6505"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#45a3ff"/><stop offset="1" stop-color="#1769e8"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="9" flood-opacity=".55"/></filter>
  </defs>
  <g filter="url(#shadow)">
    <rect x="26" y="26" width="460" height="460" rx="72" fill="#050c19" stroke="url(#gold)" stroke-width="18"/>
    <rect x="50" y="50" width="412" height="412" rx="54" fill="#081326" stroke="#45a3ff" stroke-width="9"/>
    <path d="M82 155h86l35 34H82zm348 0h-86l-35 34h121z" fill="url(#blue)" stroke="url(#gold)" stroke-width="6"/>
    <text x="256" y="308" text-anchor="middle" font-family="Arial Black,Impact,sans-serif" font-size="172" font-weight="900" fill="#f5f9ff" stroke="#1769e8" stroke-width="15" paint-order="stroke">ST</text>
    <path d="M78 344h356l-26 82H104z" fill="url(#blue)" stroke="url(#gold)" stroke-width="8"/>
    <text x="256" y="396" text-anchor="middle" font-family="Arial Black,Impact,sans-serif" font-size="31" font-weight="900" letter-spacing="1" fill="#fff3bd">SPECIAL TEAMER</text>
  </g>
</svg>
