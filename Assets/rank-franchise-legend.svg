<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Franchise Legend rank patch</title>
  <desc id="desc">Navy, electric blue, and gold football rank patch marked FL.</desc>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff0a3"/><stop offset=".4" stop-color="#e8b84a"/><stop offset="1" stop-color="#9a6505"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#45a3ff"/><stop offset="1" stop-color="#1769e8"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="9" flood-opacity=".55"/></filter>
  </defs>
  <g filter="url(#shadow)">
    <rect x="26" y="26" width="460" height="460" rx="72" fill="#050c19" stroke="url(#gold)" stroke-width="18"/>
    <rect x="50" y="50" width="412" height="412" rx="54" fill="#081326" stroke="#45a3ff" stroke-width="9"/>
    <path d="m256 70 13 27 30 4-22 21 6 30-27-14-27 14 6-30-22-21 30-4z" fill="url(#gold)"/>
    <path d="M82 166h98l26 30H82zm348 0h-98l-26 30h124z" fill="url(#blue)" stroke="url(#gold)" stroke-width="6"/>
    <text x="256" y="322" text-anchor="middle" font-family="Arial Black,Impact,sans-serif" font-size="186" font-weight="900" fill="url(#gold)" stroke="#1769e8" stroke-width="16" paint-order="stroke">FL</text>
    <path d="M58 344h396l-28 82H86z" fill="url(#blue)" stroke="url(#gold)" stroke-width="8"/>
    <text x="256" y="389" text-anchor="middle" font-family="Arial Black,Impact,sans-serif" font-size="28" font-weight="900" letter-spacing="1" fill="#fff3bd">FRANCHISE</text>
    <text x="256" y="417" text-anchor="middle" font-family="Arial Black,Impact,sans-serif" font-size="24" font-weight="900" letter-spacing="4" fill="#fff3bd">LEGEND</text>
  </g>
</svg>
