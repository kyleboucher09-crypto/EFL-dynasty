<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EFL Dynasty</title><link rel="stylesheet" href="site.css?v=20260822-navfix1"><style>
body{margin:0;background:#050408;color:#fff;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.home-shell{max-width:1180px;margin:auto;padding:18px 20px 64px}.topbar{position:sticky;top:0;z-index:100;background:#050408;border-bottom:1px solid rgba(255,255,255,.07)}.nav{max-width:1180px;margin:auto;height:78px;padding:0 20px;display:flex;align-items:center;gap:18px}.brand{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none}.brand img{width:48px;height:48px;border-radius:13px}.brand span{font-weight:950}.brand small{display:block;color:#ffd76c;font-size:8px;letter-spacing:.2em;text-transform:uppercase}.navlinks{display:flex;gap:14px;margin-left:auto}.navlinks a{color:#d4ccd8;text-decoration:none;font-size:10px;font-weight:800}.league-menu-btn,.menu-btn{height:42px;border-radius:12px;border:1px solid rgba(255,255,255,.1);background:#0c0910;color:#fff;font-weight:900}.league-menu-btn{padding:0 13px}.menu-btn{width:42px}.mobile-menu{display:none}.league-hero-card{max-width:1080px;margin:auto;aspect-ratio:2.7/1;background:#050308 url('ChatGPT Image Aug 21, 2026, 02_43_11 PM.png') center/105% auto no-repeat;border-radius:22px}.spot-wrap{margin-top:14px}.spotlight{height:360px;border-radius:20px;overflow:hidden;background:#08060c;display:grid;place-items:center}.hub-heading{display:grid;grid-template-columns:1fr auto 1fr;gap:15px;align-items:center;margin:30px 0 15px;color:#ffd76c;font-size:11px;font-weight:1000;letter-spacing:.22em}.hub-heading span{height:1px;background:#8f2bc4}.hub-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}.hub-tile{min-height:148px;border:1px solid rgba(112,39,146,.42);border-radius:18px;display:grid;justify-items:center;text-align:center;padding:9px;color:#fff;text-decoration:none}.hub-tile img{width:82px;height:82px;object-fit:contain}.hub-tile h3{font-size:12px;margin:3px}.hub-tile p{font-size:8px;color:#aaa0ad;margin:0}.weekly-section{margin-top:52px}.weekly-head{padding-bottom:18px;border-bottom:1px solid rgba(232,184,74,.25)}.weekly-head-row{display:flex;justify-content:space-between;gap:12px}.eyebrow,.weekly-tag{color:#ffd76c;text-transform:uppercase;font-size:9px;font-weight:1000;letter-spacing:.16em}.weekly-edition{font-size:9px;color:#aaa0ad}.weekly-head h2{font-size:clamp(38px,6vw,68px);line-height:.95;letter-spacing:-.05em;margin:8px 0 10px}.weekly-head p{max-width:760px;color:#aaa0ad;font-size:12px;line-height:1.6}.weekly-report{display:grid;grid-template-columns:1.15fr .85fr;gap:14px;margin-top:16px}.weekly-lead,.weekly-brief{background:#0b0810;border:1px solid rgba(255,255,255,.08);border-radius:18px;overflow:hidden}.story-art{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;background:#09070d}.story-copy{padding:18px}.weekly-lead .story-copy{padding:22px}.weekly-lead h3,.weekly-brief h4{margin:7px 0 8px;line-height:1.05}.weekly-lead h3{font-size:30px}.weekly-brief h4{font-size:18px}.weekly-teaser{margin:0;color:#cfc5d3;font-size:11px;line-height:1.55}.weekly-read{margin-top:12px;padding:10px 13px;border:1px solid rgba(255,215,108,.42);border-radius:10px;background:#09070d;color:#ffe083;font-size:8px;font-weight:1000;letter-spacing:.08em;text-transform:uppercase}.weekly-briefs{display:grid;grid-template-columns:1fr 1fr;gap:10px}.weekly-modal{position:fixed;inset:0;z-index:500;display:none;align-items:flex-end;justify-content:center;padding:14px;background:rgba(2,1,4,.86)}.weekly-modal.open{display:flex}.weekly-modal-card{width:min(760px,100%);max-height:88vh;overflow:auto;padding:24px;border-radius:22px;border:1px solid rgba(255,215,108,.25);background:#120c18}.weekly-modal-art{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:14px;margin-bottom:18px}.weekly-modal-close{float:right;width:38px;height:38px;border-radius:50%;border:1px solid rgba(255,255,255,.16);background:#0a0710;color:#fff;font-size:19px}.weekly-modal p{font-size:13px;line-height:1.78;color:#cfc4d3}@media(max-width:900px){.navlinks{display:none}.menu-btn{display:block}.hub-grid{grid-template-columns:repeat(3,1fr)}.weekly-report{grid-template-columns:1fr}.weekly-briefs{grid-template-columns:1fr 1fr}}@media(max-width:600px){.home-shell{padding:14px}.nav{height:72px;padding:0 14px}.brand img{width:44px;height:44px}.league-hero-card{width:100%;aspect-ratio:2.7/1;background-size:105% auto}.hub-grid{gap:8px}.hub-tile{min-height:124px}.hub-tile img{width:64px;height:64px}.weekly-briefs{grid-template-columns:1fr}.weekly-head-row{flex-direction:column}.weekly-lead h3{font-size:27px}.weekly-brief h4{font-size:19px}.story-copy{padding:16px}}
</style></head><body>
<header class="topbar"><div class="nav"><a class="brand" href="index.html"><img src="Assets/efl-logo.jpeg" alt="EFL"><span>EFL Dynasty<small>Elite Fantasy Footballers</small></span></a><nav class="navlinks"><a href="power-rankings.html">Power Rankings</a><a href="records.html">Records</a><a href="franchises.html">Franchises</a><a href="legacy.html">Legacy</a></nav><button class="league-menu-btn">● DYNASTY</button><button class="menu-btn">☰</button></div></header>
<main class="home-shell"><section><div class="league-hero-card"></div></section><section class="spot-wrap"><div class="spotlight"><img src="Assets/spotlight-champion-premium.jpg" alt="EFL spotlight" style="width:100%;height:100%;object-fit:cover"></div></section><div class="hub-heading"><span></span><div>EXPLORE THE HUB</div><span></span></div><section class="hub-grid"><a class="hub-tile" href="power-rankings.html"><img src="Assets/1787327944521-8fa10f5f-91ef-41fb-a360-0e0ead3dd772-Photoroom.png"><h3>Power Rankings</h3><p>Weekly hierarchy</p></a><a class="hub-tile" href="champions.html"><img src="Assets/1787328184441-7c9a3254-ba1c-4948-a0ac-e08dba539f34-Photoroom (1).png"><h3>Champions</h3><p>Every throne</p></a><a class="hub-tile" href="records.html"><img src="Assets/1787328248636-bd023ec3-9344-454b-850e-db480c5a222b-Photoroom.png"><h3>Record Book</h3><p>League history</p></a><a class="hub-tile" href="franchises.html"><img src="Assets/1787328339688-13c44f64-93c1-486f-a832-8d33aa94f48f-Photoroom.png"><h3>Franchises</h3><p>Team résumés</p></a><a class="hub-tile" href="legacy.html"><img src="Assets/1787328285245-1093d48e-000e-43e3-a159-9e113c7b8468-Photoroom.png"><h3>Legacy</h3><p>Badges & progression</p></a><a class="hub-tile" href="#news"><img src="Assets/1787328375343-5be5f099-f8bc-4b21-a39f-f318f46f17e6 (1)-Photoroom.png"><h3>Game Day</h3><p>Weekly battles</p></a></section><section class="weekly-section" id="news"><div class="weekly-head"><div class="weekly-head-row"><div class="eyebrow">EFL Newsroom</div><div class="weekly-edition" id="weeklyEdition"></div></div><h2 id="weeklyHeadline">The EFL Weekly</h2><p id="weeklyDek"></p></div><div class="weekly-report" id="weeklyReport"></div></section></main>
<div class="weekly-modal" id="weeklyModal"><article class="weekly-modal-card"><button class="weekly-modal-close" id="weeklyModalClose">×</button><img class="weekly-modal-art" id="modalArt" alt=""><div class="weekly-tag" id="modalTag"></div><h3 id="modalTitle"></h3><p id="modalBody"></p></article></div>
<script>
const q=s=>document.querySelector(s);function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function teaser(t){const m=String(t||'').match(/[^.!?]+[.!?]+/g)||[];return(m.slice(0,2).join(' ')||t||'').trim()}function art(label,lead=false){const l=String(label||'').toUpperCase();if(lead)return'Assets/spotlight-champion-premium.jpg';if(l.includes('POWER'))return'Assets/spotlight-rankings-premium.jpg';if(l.includes('CHAMPIONSHIP'))return'Assets/spotlight-champion.jpg';if(l.includes('CONTENDER')||l.includes('SLEEPER'))return'Assets/spotlight-stadium.jpg';return'Assets/spotlight-matchup-premium.jpg'}function openStory(x,img){q('#modalArt').src=img;q('#modalTag').textContent=x.label||x.tag||'';q('#modalTitle').textContent=x.title||'';q('#modalBody').textContent=x.body||'';q('#weeklyModal').classList.add('open')}q('#weeklyModalClose').onclick=()=>q('#weeklyModal').classList.remove('open');q('#weeklyModal').onclick=e=>{if(e.target===q('#weeklyModal'))q('#weeklyModal').classList.remove('open')};(async()=>{const r=await fetch('weekly-report.json?v='+Date.now());const d=await r.json();q('#weeklyEdition').textContent=[d.edition,d.published].filter(Boolean).join(' · ');q('#weeklyHeadline').textContent=d.headline;q('#weeklyDek').textContent=d.dek;const lead=d.lead,bs=d.briefs||[];q('#weeklyReport').innerHTML=`<article class="weekly-lead"><img class="story-art" src="${art(lead.tag,true)}"><div class="story-copy"><div class="weekly-tag">${esc(lead.tag)}</div><h3>${esc(lead.title)}</h3><p class="weekly-teaser">${esc(teaser(lead.body))}</p><button class="weekly-read" data-lead="1">Read Full Article →</button></div></article><div class="weekly-briefs">${bs.map((x,i)=>`<article class="weekly-brief"><img class="story-art" src="${art(x.label)}"><div class="story-copy"><div class="weekly-tag">${esc(x.label)}</div><h4>${esc(x.title)}</h4><p class="weekly-teaser">${esc(teaser(x.body))}</p><button class="weekly-read" data-i="${i}">Read Full Article →</button></div></article>`).join('')}</div>`;q('[data-lead]').onclick=()=>openStory(lead,art(lead.tag,true));q('#weeklyReport').querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{const x=bs[+b.dataset.i];openStory(x,art(x.label))})})().catch(()=>{q('#weeklyReport').innerHTML='<p>Latest EFL report is loading.</p>'});
</script></body></html>
