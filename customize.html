<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EFL Customize Franchise</title>
<style>
:root{--bg:#07060a;--gold:#ffd979;--muted:#aaa0b6}*{box-sizing:border-box}body{margin:0;background:radial-gradient(900px 500px at 50% -100px,#7d22c944,transparent),var(--bg);color:#fff;font-family:Inter,system-ui,sans-serif}.wrap{max-width:920px;margin:auto;padding:24px 16px 60px}.hero,.panel{border:1px solid #ffffff12;border-radius:22px;background:#0e0913;padding:24px}.hero{border-color:#e8b84a38}.eye{color:var(--gold);font-size:9px;font-weight:950;letter-spacing:.17em;text-transform:uppercase}.hero h1{font-size:clamp(42px,8vw,72px);line-height:.9;letter-spacing:-.05em;margin:8px 0}.hero h1 span{color:var(--gold);display:block}.hero p{color:#c8bdcf;line-height:1.6}.panel{margin-top:14px}.field{margin:12px 0}.field label{display:block;color:var(--gold);font-size:8px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;background:#08060b;color:#fff;border:1px solid #ffffff16;border-radius:10px;padding:11px;font:inherit;font-size:12px}.field textarea{min-height:95px}.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}.btn{width:100%;border:0;border-radius:11px;padding:13px;background:linear-gradient(135deg,#ffd979,#e8b84a);color:#1b1007;font-weight:1000;margin-top:12px}.msg{display:none;margin-top:12px;padding:12px;border-radius:10px;font-size:11px}.ok{background:#57d39b18;color:#7ce0ad;border:1px solid #57d39b35}.bad{background:#ff667718;color:#ff9ca7;border:1px solid #ff667735}.muted{font-size:9px;color:var(--muted);line-height:1.5}@media(max-width:600px){.two{grid-template-columns:1fr}}
</style></head><body><main class="wrap"><section class="hero"><div class="eye">Owner Submission</div><h1>CUSTOMIZE <span>YOUR FRANCHISE</span></h1><p>Submit your franchise identity directly to the commissioner. Once approved, it can appear in your EFL headquarters.</p></section><section class="panel"><div class="field"><label>Franchise</label><select id="team"><option>Loading teams…</option></select></div><div class="field"><label>Owner</label><input id="owner"></div><div class="field"><label>Team Motto</label><input id="motto" maxlength="120"></div><div class="field"><label>Home Field / Stadium</label><input id="stadium" maxlength="120"></div><div class="two"><div class="field"><label>Primary Colour</label><input id="c1" type="color" value="#7d22c9"></div><div class="field"><label>Secondary Colour</label><input id="c2" type="color" value="#e8b84a"></div></div><div class="field"><label>Franchise Player</label><input id="player" maxlength="120"></div><div class="field"><label>Nemesis</label><select id="rival"><option value="">Choose rival</option></select></div><div class="field"><label>Trash Talk Quote</label><input id="quote" maxlength="180"></div><div class="field"><label>Franchise Story</label><textarea id="story" maxlength="700"></textarea></div><div class="field"><label>Custom Logo (optional)</label><input id="logo" type="file" accept="image/png,image/jpeg,image/webp"><div class="muted">Keep the image reasonably small. The form compresses it before submission.</div></div><button class="btn" id="submit">👑 SUBMIT TO COMMISSIONER</button><div class="msg ok" id="ok">Submitted. The commissioner has been notified.</div><div class="msg bad" id="bad"></div></section></main>
<script>
const ID="1313240395462742016",API="https://api.sleeper.app/v1",Q=s=>document.querySelector(s);async function get(p){let r=await fetch(API+p);if(!r.ok)throw Error(r.status);return r.json()}function v(id){return Q(id).value.trim()}
(async()=>{try{let [u,r]=await Promise.all([get(`/league/${ID}/users`),get(`/league/${ID}/rosters`)]),ub=Object.fromEntries(u.map(x=>[x.user_id,x])),a=r.map(x=>({team:ub[x.owner_id]?.metadata?.team_name||ub[x.owner_id]?.display_name||`Roster ${x.roster_id}`,owner:ub[x.owner_id]?.display_name||""})).sort((a,b)=>a.team.localeCompare(b.team));Q("#team").innerHTML='<option value="">Choose franchise</option>'+a.map(x=>`<option data-owner="${x.owner.replaceAll('"','&quot;')}">${x.team}</option>`).join("");Q("#rival").innerHTML='<option value="">Choose rival</option>'+a.map(x=>`<option>${x.team}</option>`).join("");Q("#team").onchange=()=>{let o=Q("#team").selectedOptions[0];if(o?.dataset.owner)Q("#owner").value=o.dataset.owner}}catch(e){Q("#team").innerHTML="<option>Unable to load teams</option>"}})();
async function logoData(file){if(!file)return"";return new Promise((resolve,reject)=>{let img=new Image(),r=new FileReader();r.onload=e=>img.src=e.target.result;r.onerror=reject;img.onload=()=>{let max=500,scale=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement("canvas");c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext("2d").drawImage(img,0,0,c.width,c.height);resolve(c.toDataURL("image/jpeg",.76))};r.readAsDataURL(file)})}
Q("#submit").onclick=async()=>{Q("#ok").style.display="none";Q("#bad").style.display="none";Q("#submit").disabled=true;Q("#submit").textContent="SUBMITTING…";try{let ld=await logoData(Q("#logo").files[0]);let body={teamName:v("#team"),ownerName:v("#owner"),motto:v("#motto"),stadium:v("#stadium"),primaryColor:v("#c1"),secondaryColor:v("#c2"),franchisePlayer:v("#player"),nemesis:v("#rival"),quote:v("#quote"),story:v("#story"),logoData:ld};let r=await fetch("/api/submit",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)}),j=await r.json();if(!r.ok)throw Error(j.error||"Submission failed");Q("#ok").style.display="block";Q("#submit").textContent="✓ SUBMITTED"}catch(e){Q("#bad").textContent=e.message;Q("#bad").style.display="block";Q("#submit").disabled=false;Q("#submit").textContent="👑 SUBMIT TO COMMISSIONER"}};
</script></body></html>
