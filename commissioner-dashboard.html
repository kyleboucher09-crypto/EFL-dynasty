<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EFL Commissioner Dashboard</title>
<style>
:root{--b:#07060a;--g:#ffd979;--m:#aaa0b6}*{box-sizing:border-box}body{margin:0;background:radial-gradient(900px 500px at 50% -100px,#7d22c944,transparent),var(--b);color:#fff;font-family:Inter,system-ui,sans-serif}.wrap{max-width:1050px;margin:auto;padding:25px 16px 60px}.hero{padding:28px;border-radius:23px;border:1px solid #e8b84a38;background:#0e0913}.eye{color:var(--g);font-size:9px;font-weight:950;letter-spacing:.17em;text-transform:uppercase}.hero h1{font-size:clamp(38px,7vw,68px);line-height:.9;margin:8px 0}.hero p{color:#c8bdcf}.login,.card{margin-top:14px;padding:18px;border-radius:17px;background:#ffffff06;border:1px solid #ffffff10}.login input{width:100%;background:#08060b;color:#fff;border:1px solid #ffffff16;border-radius:10px;padding:11px}.btn{border:0;border-radius:9px;padding:10px 12px;font-weight:900;font-size:9px;margin-right:5px;margin-top:10px}.gold{background:#ffd979;color:#1a1006}.green{background:#57d39b;color:#06170e}.red{background:#ff7d89;color:#20070a}.card h3{margin:5px 0}.meta{color:var(--m);font-size:9px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.field{padding:9px;border-radius:9px;background:#ffffff06}.field small{display:block;color:var(--g);font-size:7px}.field b{font-size:10px}.story{margin-top:10px;font-size:11px;line-height:1.6;color:#d6cbdc}.status{display:inline-block;padding:5px 7px;border-radius:999px;font-size:8px;font-weight:900;background:#ffffff10}.logo{width:70px;height:70px;border-radius:14px;object-fit:cover;margin-top:10px}@media(max-width:620px){.grid{grid-template-columns:1fr}}
</style></head><body><main class="wrap"><section class="hero"><div class="eye">Commissioner's Office</div><h1>FRANCHISE APPROVALS</h1><p>Review owner submissions and approve what goes live.</p></section><section class="login" id="login"><div class="eye">Commissioner Access</div><input id="key" type="password" placeholder="Enter commissioner key"><button class="btn gold" id="load">OPEN DASHBOARD</button></section><section id="list"></section></main>
<script>
const Q=s=>document.querySelector(s);let KEY="";Q("#load").onclick=()=>{KEY=Q("#key").value;load()};
async function load(){let r=await fetch("/api/submissions",{headers:{"x-commissioner-key":KEY}});if(r.status===401){alert("Wrong commissioner key");return}let j=await r.json();Q("#login").style.display="none";Q("#list").innerHTML=(j.submissions||[]).map(x=>`<article class="card" id="s${x.id}"><div class="eye">Submission #${x.id}</div><h3>${x.team_name}</h3><div class="meta">${x.owner_name||""} · ${new Date(x.created_at).toLocaleString()}</div><div class="status">${x.status.toUpperCase()}</div>${x.logo_data?`<img class="logo" src="${x.logo_data}">`:""}<div class="grid"><div class="field"><small>MOTTO</small><b>${esc(x.motto)}</b></div><div class="field"><small>HOME FIELD</small><b>${esc(x.stadium)}</b></div><div class="field"><small>FRANCHISE PLAYER</small><b>${esc(x.franchise_player)}</b></div><div class="field"><small>NEMESIS</small><b>${esc(x.nemesis)}</b></div><div class="field"><small>COLORS</small><b>${esc(x.primary_color)} · ${esc(x.secondary_color)}</b></div><div class="field"><small>QUOTE</small><b>${esc(x.quote)}</b></div></div><div class="story">${esc(x.story)}</div><button class="btn green" onclick="review(${x.id},'approved')">✓ APPROVE</button><button class="btn red" onclick="review(${x.id},'rejected')">✕ REJECT</button></article>`).join("")||'<div class="card">No submissions yet.</div>'}
function esc(v=""){return String(v).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
async function review(id,status){let note=prompt(status==="approved"?"Optional approval note:":"Optional rejection note:")||"";let r=await fetch("/api/review",{method:"POST",headers:{"Content-Type":"application/json","x-commissioner-key":KEY},body:JSON.stringify({id,status,note})});if(!r.ok){alert("Could not update");return}load()}
</script></body></html>
