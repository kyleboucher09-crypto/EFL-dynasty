<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Reset EFL Password</title>
  <link rel="stylesheet" href="account.css?v=1">
</head>
<body>
<main class="wrap">
  <header class="top"><img src="Assets/efl-logo.jpeg" alt="EFL logo"><div class="brand"><b>EFL Dynasty</b><small>ACCOUNT SECURITY</small></div><a href="account.html">EFL Account</a></header>
  <section class="hero"><div class="eye">Account Recovery</div><h1>RESET YOUR<br>PASSWORD.</h1><p>Choose a new password for your EFL account. Reset links expire and can only be used with the secure token sent to your verified email.</p></section>
  <section class="stage" style="max-width:600px;margin-left:auto;margin-right:auto">
    <div id="resetMsg" class="statusbox hidden"></div>
    <form id="resetForm">
      <div class="eye">New Password</div><h2 style="margin:6px 0">Secure your account</h2>
      <div class="field"><label>NEW PASSWORD</label><input id="newPassword" type="password" autocomplete="new-password" minlength="10" maxlength="128" required></div>
      <div class="field"><label>CONFIRM PASSWORD</label><input id="confirmPassword" type="password" autocomplete="new-password" minlength="10" maxlength="128" required></div>
      <button class="primary full" type="submit">RESET PASSWORD</button>
    </form>
  </section>
</main>
<script>
const Q=s=>document.querySelector(s);const token=new URLSearchParams(location.search).get('token');function msg(t,type=''){const e=Q('#resetMsg');e.textContent=t;e.className=`statusbox ${type}`.trim();e.classList.remove('hidden')}
if(!token){msg('This reset link is missing its secure token. Request a new password reset from the EFL Account page.','bad');Q('#resetForm').classList.add('hidden')}
Q('#resetForm').onsubmit=async e=>{e.preventDefault();const p=Q('#newPassword').value,c=Q('#confirmPassword').value;if(p!==c)return msg('Those passwords do not match.','bad');const b=e.submitter;b.disabled=true;b.textContent='RESETTING…';try{const r=await fetch('/api/auth/reset-password',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({newPassword:p,token})});let j={};try{j=await r.json()}catch{}if(!r.ok)return msg(j.message||j.error||'This reset link may have expired. Request a new one.','bad');msg('Password changed. You can now sign in to your EFL account.','good');Q('#resetForm').innerHTML='<a class="primary full" style="display:block;text-align:center;text-decoration:none" href="account.html">RETURN TO EFL SIGN IN</a>'}catch{msg('Could not reset your password right now.','bad')}finally{b.disabled=false;b.textContent='RESET PASSWORD'}};
</script>
</body>
</html>
