name: Fix slider icons
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-slider-icons.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace broken external trend images
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace("      const icon=c.querySelector('.trend-icon img')?.getAttribute('src')||'Assets/trending-hold.svg';\n","")
          old='''      return `<div class="rank-card"><div class="rank-place">${ord(i)}</div><div><div class="rank-name">${esc(team)}</div><div class="rank-meta">Power ${esc(power)} · ${esc(movement)}</div></div><img src="${esc(icon)}" alt="" style="width:28px;height:28px"></div>`;'''
          new='''      const lower=movement.toLowerCase(); const up=lower.startsWith('up'); const down=lower.startsWith('down'); const symbol=up?'↑':down?'↓':'—'; const color=up?'#62d7a0':down?'#ff7785':'#ffd979';
      return `<div class="rank-card"><div class="rank-place">${ord(i)}</div><div><div class="rank-name">${esc(team)}</div><div class="rank-meta">Power ${esc(power)} · ${esc(movement)}</div></div><span aria-label="${esc(movement)}" style="width:30px;height:30px;border-radius:50%;display:grid;place-items:center;border:1px solid rgba(232,184,74,.45);background:#120b19;color:${color};font-size:20px;font-weight:1000;line-height:1">${symbol}</span></div>`;'''
          if old not in s:
              raise SystemExit('slider return block not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix slider trend icons on mobile"
          git push
