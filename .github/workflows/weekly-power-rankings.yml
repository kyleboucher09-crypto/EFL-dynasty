name: Weekly EFL Power Rankings

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/weekly-power-rankings.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install requests
      - name: Refresh current EFL rankings
        run: python scripts/refresh_power_rankings.py
      - name: Commit rankings refresh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add power-rankings.html power-rankings-data.json power-rankings-prev.json
          git diff --cached --quiet && exit 0
          git commit -m "Refresh current EFL power rankings"
          git push
