name: Tune 2026 mobile banner width

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Slightly enlarge mobile banner artwork
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('site.css')
          s=p.read_text()
          old="@media(max-width:600px){.league-hero-card{width:100%!important;aspect-ratio:2.7/1!important;background-size:contain!important;background-position:center!important;background-repeat:no-repeat!important;background-color:#050308!important}"
          new="@media(max-width:600px){.league-hero-card{width:100%!important;aspect-ratio:2.7/1!important;background-size:105% auto!important;background-position:center!important;background-repeat:no-repeat!important;background-color:#050308!important}"
          if old not in s:
              raise SystemExit('Expected mobile hero rule not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit mobile banner sizing
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site.css
          git diff --cached --quiet && exit 0
          git commit -m "Slightly enlarge 2026 mobile banner artwork"
          git push
