name: Fix 2026 mobile banner width

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-banner-final.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove mobile banner crop override
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('site.css')
          s=p.read_text()
          old="""/* Mobile 2026 main banner: aggressively crop baked-in black above/below while keeping the card dimensions unchanged. */
@media(max-width:600px){html body .league-hero-card{aspect-ratio:2.15/1!important;background-size:auto 142%!important;background-position:center 59%!important}}"""
          new="""/* Mobile 2026 main banner: show the full artwork edge-to-edge without horizontal cropping. */
@media(max-width:600px){html body .league-hero-card{width:100%!important;aspect-ratio:2.7/1!important;background-size:contain!important;background-position:center!important;background-repeat:no-repeat!important;background-color:#050308!important}}"""
          if old not in s:
              raise SystemExit('Expected mobile banner crop override not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit banner fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site.css
          git diff --cached --quiet && exit 0
          git commit -m "Show full 2026 banner on mobile"
          git push

# rerun after workflow exists on main
