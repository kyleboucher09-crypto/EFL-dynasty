name: Fix mobile hero banner crop

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-mobile-hero-banner.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show full top banner on mobile
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('site.css')
          s=p.read_text()
          old="@media(max-width:600px){.league-hero-card{width:100%!important;aspect-ratio:2.15/1!important;background-size:cover!important}"
          new="@media(max-width:600px){.league-hero-card{width:100%!important;aspect-ratio:2.7/1!important;background-size:contain!important;background-position:center!important;background-repeat:no-repeat!important;background-color:#050308!important}"
          if old not in s:
              raise SystemExit('Expected mobile hero rule not found; no changes made')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit mobile banner fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site.css
          git diff --cached --quiet && exit 0
          git commit -m "Show full 2026 hero banner on mobile"
          git push
