name: Announce EFL Weekly in Discord

on:
  push:
    branches: [main]
    paths:
      - 'weekly-report.json'
      - '.github/workflows/discord-weekly-report.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  announce:
    runs-on: ubuntu-latest
    steps:
      - name: Post latest EFL Weekly to Discord
        run: |
          curl --fail --silent --show-error \
            --retry 5 --retry-delay 8 --retry-all-errors \
            -X POST \
            https://www.efldynasty.com/api/discord-announce-weekly
