name: Cache Bust Discord EFL Logo

on:
  push:
    branches: [discord-logo-cache-bust]
    paths:
      - '.github/workflows/cache-bust-discord-logo.yml'

permissions:
  contents: write

jobs:
  update-logo-url:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Switch all Discord embeds to fresh EFL logo URL
        shell: python
        run: |
          from pathlib import Path
          old = 'https://www.efldynasty.com/Assets/efl-logo.jpeg'
          new = 'https://www.efldynasty.com/Assets/efl-logo.jpeg?v=efl-2026-08-31'
          changed = []
          for path in Path('api').glob('discord*.js'):
              text = path.read_text(encoding='utf-8')
              updated = text.replace(old, new)
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(str(path))
          print('Updated:', ', '.join(changed))
          if not changed:
              raise SystemExit('No Discord logo references were updated')

      - name: Remove one-time workflow and commit
        run: |
          git rm .github/workflows/cache-bust-discord-logo.yml
          git config user.name "EFL Website Bot"
          git config user.email "actions@users.noreply.github.com"
          git add api/discord*.js
          git commit -m "Refresh EFL logo across Discord embeds"
          git push
