name: Compact preseason articles on homepage

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/preseason-articles.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compact homepage newsroom cards
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()

          extra_css='''
.weekly-lead,.weekly-brief{position:relative;overflow:hidden;isolation:isolate}.weekly-lead:before,.weekly-brief:before{content:"";position:absolute;inset:0;background-image:var(--story-image);background-size:cover;background-position:center;z-index:-2;opacity:.6}.weekly-lead:after,.weekly-brief:after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(5,3,8,.05),rgba(5,3,8,.62) 46%,rgba(5,3,8,.98))}.weekly-teaser{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:#d3c8d7!important}.weekly-read{display:inline-flex;margin-top:12px;padding:9px 12px;border:1px solid rgba(255,215,108,.4);border-radius:10px;background:rgba(7,4,10,.76);color:#ffe083;font-size:8px;font-weight:1000;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}.weekly-lead{min-height:350px!important}.weekly-brief{min-height:230px!important;display:flex;flex-direction:column;justify-content:flex-end}.weekly-brief .weekly-icon{position:absolute;top:15px;left:15px}.weekly-modal{position:fixed;inset:0;z-index:500;display:none;align-items:flex-end;justify-content:center;padding:14px;background:rgba(2,1,4,.84);backdrop-filter:blur(10px)}.weekly-modal.open{display:flex}.weekly-modal-card{width:min(760px,100%);max-height:88vh;overflow:auto;padding:24px;border-radius:22px;border:1px solid rgba(255,215,108,.25);background:linear-gradient(160deg,#17101f,#08060b 68%);box-shadow:0 30px 80px rgba(0,0,0,.65)}.weekly-modal-art{height:185px;margin:-24px -24px 20px;background-image:linear-gradient(180deg,transparent 25%,#17101f),var(--story-image);background-size:cover;background-position:center;border-radius:22px 22px 0 0}.weekly-modal h3{font-size:clamp(27px,5vw,42px);line-height:1.02;letter-spacing:-.04em;margin:7px 0 15px}.weekly-modal p{font-size:13px;line-height:1.78;color:#cfc4d3}.weekly-modal-close{position:sticky;float:right;top:0;width:38px;height:38px;border-radius:50%;border:1px solid rgba(255,255,255,.16);background:#0a0710;color:#fff;font-size:19px;cursor:pointer;z-index:2}@media(max-width:600px){.weekly-lead{min-height:285px!important}.weekly-brief{min-height:205px!important}.weekly-brief h4{font-size:19px!important}.weekly-modal{padding:7px}.weekly-modal-card{max-height:92vh;padding:19px}.weekly-modal-art{height:145px;margin:-19px -19px 18px}.weekly-modal p{font-size:12px}}
'''
          if '.weekly-modal{' not in s:
              s=s.replace('</style></head>',extra_css+'</style></head>',1)

          start=s.find('(async function loadWeeklyReport(){')
          end=s.find('\n(function(){const slides=',start)
          if start<0 or end<0:
              raise SystemExit('weekly loader not found')

          loader='''(async function loadWeeklyReport(){try{const r=await fetch('weekly-report.json?v='+Date.now());if(!r.ok)throw Error(r.status);const d=await r.json();q('#weeklyEdition').textContent=[d.edition,d.published].filter(Boolean).join(' · ');q('#weeklyHeadline').textContent=d.headline||'The EFL Weekly';q('#weeklyDek').textContent=d.dek||'';const lead=d.lead||{},briefs=Array.isArray(d.briefs)?d.briefs:[];const art=(label,leadStory=false)=>{const l=String(label||'').toUpperCase();if(leadStory)return 'Assets/spotlight-champion-premium.jpg';if(l.includes('POWER'))return 'Assets/spotlight-rankings-premium.jpg';if(l.includes('CHAMPIONSHIP'))return 'Assets/spotlight-champion.jpg';if(l.includes('CONTENDER')||l.includes('SLEEPER'))return 'Assets/spotlight-stadium.jpg';if(l.includes('NEXT')||l.includes('WEEK'))return 'Assets/spotlight-matchup-premium.jpg';return 'Assets/spotlight-record-premium.jpg'};const teaser=b=>{const t=String(b||'').trim(),m=t.match(/[^.!?]+[.!?]+/g)||[];return(m.slice(0,2).join(' ').trim()||t).slice(0,250)};q('#weeklyReport').innerHTML=`<article class="weekly-lead" style="--story-image:url('${art(lead.tag,true)}')"><div class="weekly-tag">${esc(lead.tag||'EFL WEEKLY')}</div><h3>${esc(lead.title||'This week around the league')}</h3><p class="weekly-teaser">${esc(teaser(lead.body))}</p><button class="weekly-read" type="button" data-story="lead">Read Full Article →</button></article><div class="weekly-briefs">${briefs.map((x,i)=>`<article class="weekly-brief" style="--story-image:url('${art(x.label)}')"><div class="weekly-icon">${esc(x.icon||'•')}</div><div class="weekly-tag">${esc(x.label||'LEAGUE NOTE')}</div><h4>${esc(x.title||'Around the EFL')}</h4><p class="weekly-teaser">${esc(teaser(x.body))}</p><button class="weekly-read" type="button" data-story="${i}">Read Full Article →</button></article>`).join('')}</div>`;let modal=q('#weeklyModal');if(!modal){modal=document.createElement('div');modal.id='weeklyModal';modal.className='weekly-modal';modal.innerHTML='<article class="weekly-modal-card"><button class="weekly-modal-close" type="button">×</button><div class="weekly-modal-art"></div><div class="weekly-tag" id="modalTag"></div><h3 id="modalTitle"></h3><p id="modalBody"></p></article>';document.body.appendChild(modal);const close=()=>modal.classList.remove('open');modal.querySelector('.weekly-modal-close').onclick=close;modal.addEventListener('click',e=>{if(e.target===modal)close()})}q('#weeklyReport').querySelectorAll('.weekly-read').forEach(btn=>btn.onclick=()=>{const k=btn.dataset.story,x=k==='lead'?lead:briefs[Number(k)],isLead=k==='lead';modal.style.setProperty('--story-image',`url('${art(x.tag||x.label,isLead)}')`);q('#modalTag').textContent=x.tag||x.label||'EFL NEWSROOM';q('#modalTitle').textContent=x.title||'EFL Story';q('#modalBody').textContent=x.body||'';modal.classList.add('open')})}catch(e){q('#weeklyReport').innerHTML='<div class="weekly-loading">The EFL newsroom is preparing the latest report.</div>'}})();'''
          s=s[:start]+loader+s[end:]
          p.write_text(s)
          PY
      - name: Commit homepage newsroom redesign
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Make homepage articles compact and visual"
          git push
