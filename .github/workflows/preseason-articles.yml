name: Compact preseason articles on homepage

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/preseason-articles.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch homepage newsroom directly
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()

          marker='EFL_NEWSROOM_COMPACT_V2'
          if marker in s:
              print('Already patched')
              raise SystemExit(0)

          css='''
<style id="EFL_NEWSROOM_COMPACT_V2">
.weekly-lead,.weekly-brief{position:relative!important;overflow:hidden!important;isolation:isolate!important}
.weekly-lead:before,.weekly-brief:before{content:"";position:absolute;inset:0;background-image:var(--story-image);background-size:cover;background-position:center;z-index:-2;opacity:.58}
.weekly-lead:after,.weekly-brief:after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(5,3,8,.08),rgba(5,3,8,.58) 42%,rgba(5,3,8,.98) 82%)}
.weekly-lead{min-height:340px!important;background:#0a0710!important}
.weekly-brief{min-height:225px!important;display:flex!important;flex-direction:column!important;justify-content:flex-end!important;background:#0a0710!important}
.weekly-brief .weekly-icon{position:absolute!important;top:15px!important;left:15px!important}
.weekly-teaser{display:-webkit-box!important;-webkit-line-clamp:2!important;-webkit-box-orient:vertical!important;overflow:hidden!important;color:#d4cad8!important}
.weekly-read{display:inline-flex;align-items:center;justify-content:center;margin-top:12px;padding:10px 13px;border:1px solid rgba(255,215,108,.42);border-radius:10px;background:rgba(6,4,9,.78);color:#ffe083;font-size:8px;font-weight:1000;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;width:max-content}
.weekly-modal{position:fixed;inset:0;z-index:500;display:none;align-items:flex-end;justify-content:center;padding:14px;background:rgba(2,1,4,.86);backdrop-filter:blur(10px)}
.weekly-modal.open{display:flex}
.weekly-modal-card{width:min(760px,100%);max-height:88vh;overflow:auto;padding:24px;border-radius:22px;border:1px solid rgba(255,215,108,.25);background:linear-gradient(160deg,#17101f,#08060b 68%);box-shadow:0 30px 80px rgba(0,0,0,.65)}
.weekly-modal-art{height:185px;margin:-24px -24px 20px;background-image:linear-gradient(180deg,transparent 25%,#17101f),var(--story-image);background-size:cover;background-position:center;border-radius:22px 22px 0 0}
.weekly-modal h3{font-size:clamp(27px,5vw,42px);line-height:1.02;letter-spacing:-.04em;margin:7px 0 15px}
.weekly-modal p{font-size:13px;line-height:1.78;color:#cfc4d3}
.weekly-modal-close{position:sticky;float:right;top:0;width:38px;height:38px;border-radius:50%;border:1px solid rgba(255,255,255,.16);background:#0a0710;color:#fff;font-size:19px;cursor:pointer;z-index:2}
@media(max-width:600px){.weekly-lead{min-height:285px!important}.weekly-brief{min-height:205px!important}.weekly-brief h4{font-size:19px!important}.weekly-modal{padding:7px}.weekly-modal-card{max-height:92vh;padding:19px}.weekly-modal-art{height:145px;margin:-19px -19px 18px}.weekly-modal p{font-size:12px}}
</style>
'''

          js='''
<script>
(function(){
 const art=(label,lead)=>{const l=String(label||'').toUpperCase();if(lead)return 'Assets/spotlight-champion-premium.jpg';if(l.includes('POWER'))return 'Assets/spotlight-rankings-premium.jpg';if(l.includes('CHAMPIONSHIP'))return 'Assets/spotlight-champion.jpg';if(l.includes('CONTENDER')||l.includes('SLEEPER'))return 'Assets/spotlight-stadium.jpg';if(l.includes('NEXT')||l.includes('WEEK'))return 'Assets/spotlight-matchup-premium.jpg';return 'Assets/spotlight-record-premium.jpg'};
 const teaser=t=>{t=String(t||'').trim();const m=t.match(/[^.!?]+[.!?]+/g)||[];return(m.slice(0,2).join(' ').trim()||t).slice(0,260)};
 function ensureModal(){let m=document.getElementById('weeklyModal');if(m)return m;m=document.createElement('div');m.id='weeklyModal';m.className='weekly-modal';m.innerHTML='<article class="weekly-modal-card"><button class="weekly-modal-close" type="button">×</button><div class="weekly-modal-art"></div><div class="weekly-tag" id="modalTag"></div><h3 id="modalTitle"></h3><p id="modalBody"></p></article>';document.body.appendChild(m);const close=()=>m.classList.remove('open');m.querySelector('.weekly-modal-close').onclick=close;m.addEventListener('click',e=>{if(e.target===m)close()});return m}
 function compact(){const lead=document.querySelector('.weekly-lead'),briefs=[...document.querySelectorAll('.weekly-brief')];if(!lead||!briefs.length||lead.dataset.compact==='1')return false;const cards=[lead,...briefs];cards.forEach((card,i)=>{const p=card.querySelector('p');if(!p)return;const full=p.textContent.trim();const tag=card.querySelector('.weekly-tag')?.textContent.trim()||'EFL NEWSROOM';const title=(card.querySelector('h3')||card.querySelector('h4'))?.textContent.trim()||'EFL Story';card.style.setProperty('--story-image',`url('${art(tag,i===0)}')`);p.dataset.full=full;p.textContent=teaser(full);p.classList.add('weekly-teaser');const b=document.createElement('button');b.type='button';b.className='weekly-read';b.textContent='Read Full Article →';b.onclick=()=>{const m=ensureModal();m.style.setProperty('--story-image',`url('${art(tag,i===0)}')`);m.querySelector('#modalTag').textContent=tag;m.querySelector('#modalTitle').textContent=title;m.querySelector('#modalBody').textContent=full;m.classList.add('open')};card.appendChild(b)});lead.dataset.compact='1';return true}
 const obs=new MutationObserver(()=>compact());obs.observe(document.getElementById('weeklyReport')||document.body,{childList:true,subtree:true});compact();setTimeout(compact,500);setTimeout(compact,1500)
})();
</script>
'''
          if '</head>' not in s or '</body>' not in s:
              raise SystemExit('index structure not found')
          s=s.replace('</head>',css+'</head>',1)
          s=s.replace('</body>',js+'</body>',1)
          p.write_text(s)
          PY
      - name: Commit compact newsroom
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Make homepage articles compact and visual"
          git push
